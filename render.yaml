services:
  - type: web
    name: deployguard-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -e ."
    startCommand: "python -m uvicorn deployguard.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_URL
        value: https://deployguard-ai.onrender.com
      - key: ALLOWED_HOSTS
        value: '["deployguard-ai.onrender.com","localhost","127.0.0.1"]'
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: deployguard
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_API_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: SUPPORTED_AST_LANGUAGES
        value: '["python"]'
