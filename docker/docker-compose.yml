version: "3.8"

services:
  # ------------------------------------------------------------------
  # DeployGuard AI — API & Gate Enforcement Service
  # ------------------------------------------------------------------
  deployguard-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deployguard-api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=deployguard
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-dev-webhook-secret}
      - GITHUB_API_TOKEN=${GITHUB_API_TOKEN:-ghp_placeholder}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # MongoDB Database (Local Graph & Document Store)
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: deployguard-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=deployguard
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local

