[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deployguard-ai"
version = "1.1.0"
description = "AI-Powered Release Risk, Cross-File AST Diff & Multi-Tenant RBAC Platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
deployguard = "deployguard.api.main:app"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B"]
ignore = ["E501", "E402", "B008", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["deployguard"]
omit = ["tests/*", "**/__init__.py"]
