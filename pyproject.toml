[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deployguard-ai"
version = "1.0.0"
description = "AI-Powered Release Risk & Change-Impact Platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # HTTP client (async)
    "httpx>=0.27.0",

    # Settings management
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # MongoDB async driver (for future agent stage)
    "motor>=3.4.0",

    # LangChain (for future LLM agent stage)
    # "langchain>=0.2.0",
    # "langchain-openai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",       # For TestClient

    # Code quality
    "ruff>=0.4.0",
    "mypy>=1.10.0",

    # Type stubs
    "types-python-dateutil",
]

[project.scripts]
deployguard = "deployguard.api.main:app"

[tool.hatch.envs.default]
features = ["dev"]

# ──────────────────────────────────────────────────────────────
# Ruff — linting and formatting
# ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "ANN101",  # Missing type annotation for self in method
    "ANN102",  # Missing type annotation for cls in classmethod
    "S101",    # assert statements (used in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

# ──────────────────────────────────────────────────────────────
# MyPy — static type checking
# ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ──────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=deployguard --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["deployguard"]
omit = ["tests/*", "**/__init__.py"]

